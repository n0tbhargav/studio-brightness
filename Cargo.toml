[package]
name = "studio-brightness"
version = "0.3.0"
edition = "2024"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "raw-window-handle-06"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.8.0"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
tray-icon = "0.25.1"
windows = { version = "0.62.2", features = [
    "Devices_Sensors", "Foundation",
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry", "Win32_System_SystemInformation",
    "Win32_Devices_HumanInterfaceDevice",
] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
